<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">

</head>

<body>

  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container-fluid px-4">
      <span class="navbar-brand mb-0 h1">Expense Tracker</span>
      <button id="theme-toggle" class="btn btn-outline-light btn-sm">Toggle Dark Mode</button>
    </div>
  </nav>

  <div class="container my-4">

    <div class="row g-4 text-center mb-4">
      <div class="col-md-4 ">
        <div class="card main-card shadow-sm py-3 h-100">
          <div class="card-body">
            <h6 class="text-muted fw-normal mb-2">Total</h6>
            <h2 class="fw-bold mb-0" id="total-amount">0.00</h2>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card main-card shadow-sm py-3 h-100">
          <div class="card-body">
            <h6 class="text-muted fw-normal mb-2">Number of expenses</h6>
            <h2 class="fw-bold mb-0" id="expenses-count">0</h2>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card main-card shadow-sm py-3 h-100">
          <div class="card-body">
            <h6 class="text-muted fw-normal mb-2">Highest expense</h6>
            <h2 class="fw-bold mb-1" id="highest-expense">0.00</h2>
            <small class="text-muted" id="highest-expense-title">-</small>
          </div>
        </div>
      </div>
    </div>

    
    <div class="card main-card shadow-sm p-4 mb-4">
      <h5 class="mb-3">Add expense</h5>
      <form id="add-form" novalidate>

        
        <div class="row g-3">

          <div class="col-md-3">
            <label class="form-label text-muted">Title</label>
            <input type="text" class="form-control" id="title-input" placeholder="Lunch" required>
            <div class="invalid-feedback"></div>
          </div>

          <div class="col-md-2">
            <label class="form-label text-muted">Amount</label>
            <input type="number" step="0.01" class="form-control" id="amount-input" placeholder="4.5" required>
            <div class="invalid-feedback"></div>
          </div>

          <div class="col-md-3">
            <label class="form-label text-muted">Category</label>
            <select class="form-select" id="category-input" required>
              <option value="" selected disabled>Choose...</option>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Bills">Bills</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Other">Other</option>
            </select>
            <div class="invalid-feedback"></div>
          </div>

          <div class="col-md-2">
            <label class="form-label text-muted">Date</label>
            <input type="date" class="form-control" id="date-input" required>
            <div class="invalid-feedback"></div>
          </div>

          <div class="col-md-2">

            <label class="form-label d-none d-md-block">&nbsp;</label>
            <button type="submit" class="btn btn-primary w-100">Add expense</button>
          </div>

        </div>
      </form>
    </div>


    <div class="card main-card shadow-sm p-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="mb-0">Expenses</h5>
        <div class="d-flex align-items-center">
          <label class="me-2 text-muted">Category</label>
          <select class="form-select form-select-sm" id="filter-category" style="width: 140px;">
            <option value="All" selected>All</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Bills">Bills</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Other">Other</option>
          </select>
        </div>
      </div>

      <div class="table-responsive">
        <table class="table align-middle mb-0 table-striped">
          <thead>
            <tr>
              <th>Title</th>
              <th>Amount</th>
              <th>Category</th>
              <th>Date</th>
              <th class="text-end">Actions</th>
            </tr>
          </thead>
          <tbody id="expenses-tbody">

          </tbody>
        </table>
      </div>
    </div>

  </div>


  <div class="modal fade" id="editExpenseModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Edit Expense</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>

        <form id="edit-form" novalidate>
          <div class="modal-body">
            <input type="hidden" id="edit-id">

            <div class="mb-3">
              <label class="form-label text-muted">Title</label>
              <input type="text" class="form-control" id="edit-title" placeholder="Lunch" required>
              <div class="invalid-feedback"></div>
            </div>

            <div class="mb-3">
              <label class="form-label text-muted">Amount</label>
              <input type="number" step="0.01" class="form-control" id="edit-amount" placeholder="4.5" required>
              <div class="invalid-feedback"></div>
            </div>

            <div class="mb-3">
              <label class="form-label text-muted">Category</label>
              <select class="form-select" id="edit-category" required>
                <option value="" disabled>Choose...</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Bills">Bills</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
              </select>
              <div class="invalid-feedback"></div>
            </div>

            <div class="mb-3">
              <label class="form-label text-muted">Date</label>
              <input type="date" class="form-control" id="edit-date" required>
              <div class="invalid-feedback"></div>
            </div>
          </div>

          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Save Changes</button>
          </div>
        </form>

      </div>
    </div>
  </div>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
